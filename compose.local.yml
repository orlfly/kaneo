services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.local
    # Host port 5432 is used by the standalone kaneo-postgres container;
    # this compose postgres is only consumed by the api service.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1338:1337"
    environment:
      - DATABASE_URL=postgres://kaneo:${POSTGRES_PASSWORD}@postgres:5432/kaneo
      - KANEO_API_URL=http://localhost:1338
      - CORS_ORIGINS=http://localhost:5174,http://192.168.6.32:5174
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

#  Optional
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5174:5173"
    environment:
      - KANEO_API_URL=http://localhost:1338
    env_file:
      - .env.local
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
