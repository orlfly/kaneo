services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "1337:1337"
    environment:
      # Explicit; ${POSTGRES_PASSWORD} is interpolated from .env next to this file.
      - DATABASE_URL=postgres://kaneo:${POSTGRES_PASSWORD}@postgres:5432/kaneo
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

#  Optional for HA setup
#  redis:
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - KANEO_API_URL=http://192.168.6.32:1337
      - KANEO_CLIENT_URL=http://192.168.6.32:5173
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: